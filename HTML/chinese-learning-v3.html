<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&#33775;&#35486;&#23416;&#32722; &middot; Chinesisch Lernen</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<style>
:root{--bg:#f6f2ec;--panel:#fff;--ink:#1c2033;--ink2:rgba(28,32,51,.55);--ink3:rgba(28,32,51,.28);--red:#d9432a;--blue:#3a6fd8;--green:#2e8b57;--gold:#d4860a;--border:#e2ddd8;--r:14px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
.app-header{background:var(--ink);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.app-header h1{color:#fff;font-size:17px;font-weight:800;line-height:1.2;}
.app-header h1 small{display:block;font-size:11px;font-weight:400;color:rgba(255,255,255,.5);letter-spacing:.5px;}
.nav-wrapper{max-width:940px;margin:0 auto;padding:16px 16px 0;}
.series-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.series-pill{padding:8px 18px;border-radius:50px;border:2px solid var(--border);background:var(--panel);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;color:var(--ink2);}
.series-pill:hover{border-color:var(--blue);color:var(--blue);}
.series-pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.book-tabs{display:flex;background:var(--panel);border-radius:var(--r) var(--r) 0 0;border:2px solid var(--border);border-bottom:none;overflow-x:auto;scrollbar-width:none;}
.book-tabs::-webkit-scrollbar{display:none;}
.book-tab{flex:0 0 auto;padding:10px 14px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;color:var(--ink2);border-right:1px solid var(--border);transition:all .2s;background:transparent;white-space:nowrap;}
.book-tab:last-child{border-right:none;}
.book-tab:hover{color:var(--ink);background:rgba(28,32,51,.04);}
.book-tab.active{background:var(--bg);color:var(--ink);}
.book-tab .t-emoji{font-size:16px;display:block;margin-bottom:1px;}
.book-tab .t-sub{font-size:9px;font-weight:400;color:var(--ink3);}
.main-panel{max-width:940px;margin:0 auto;background:var(--bg);border:2px solid var(--border);border-top:none;border-radius:0 0 var(--r) var(--r);overflow:hidden;}
.lesson-strip{background:var(--panel);padding:12px 16px 10px;border-bottom:2px solid var(--border);display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.lesson-strip-label{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);width:100%;margin-bottom:2px;}
.lesson-btn{padding:6px 12px;border-radius:50px;border:1.5px solid var(--border);background:var(--panel);font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;transition:all .2s;}
.lesson-btn:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px);}
.lesson-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.content-area{padding:20px;}
.welcome{text-align:center;padding:48px 24px;color:var(--ink2);}
.w-emoji{font-size:52px;margin-bottom:14px;}
.welcome h2{font-size:22px;font-weight:800;color:var(--ink);margin-bottom:10px;}
.welcome p{font-size:14px;line-height:1.7;}
.lesson-hd{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;background:var(--panel);border-radius:var(--r);padding:18px;border:1.5px solid var(--border);}
.lesson-badge{width:48px;height:48px;background:var(--ink);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;flex-shrink:0;}
.lesson-hd-text h2{font-size:20px;font-weight:900;margin-bottom:4px;}
.lesson-hd-text .py{font-size:13px;color:var(--blue);font-weight:600;margin-bottom:2px;}
.lesson-hd-text .zhu{font-size:13px;color:var(--green);font-weight:600;margin-bottom:2px;}
.lesson-hd-text .de{font-size:12px;color:var(--ink2);}
.lesson-illo{background:var(--panel);border-radius:var(--r);border:1.5px solid var(--border);text-align:center;padding:24px 12px;margin-bottom:18px;font-size:64px;}
.lesson-illo p{font-size:11px;color:var(--ink3);margin-top:8px;}
.sec-label{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.lesson-text-box{background:var(--panel);border-radius:var(--r);border:1.5px solid var(--border);padding:16px;margin-bottom:18px;}
.text-line{padding:10px 0;border-bottom:1px solid var(--border);}
.text-line:last-child{border-bottom:none;}
.text-zh{font-size:20px;font-weight:700;margin-bottom:3px;font-family:'Noto Sans TC',sans-serif;}
.text-py{font-size:12px;color:var(--blue);margin-bottom:1px;}
.text-zhu{font-size:12px;color:var(--green);}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:20px;}
.vocab-card{background:var(--panel);border-radius:var(--r);border:1.5px solid var(--border);padding:14px 12px;cursor:pointer;transition:all .2s;border-top:4px solid;}
.vocab-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.08);}
.vc-char{font-size:38px;font-weight:900;text-align:center;font-family:'Noto Sans TC',sans-serif;margin-bottom:6px;}
.vc-py{font-size:12px;color:var(--blue);font-weight:600;text-align:center;}
.vc-zhu{font-size:12px;color:var(--green);font-weight:600;text-align:center;margin-top:2px;}
.vc-de{font-size:11px;color:var(--ink2);text-align:center;margin-top:4px;}
.vc-hint{font-size:9px;color:var(--ink3);text-align:center;margin-top:6px;}
.vc-c1{border-top-color:#d9432a;} .vc-c2{border-top-color:#3a6fd8;} .vc-c3{border-top-color:#2e8b57;}
.vc-c4{border-top-color:#d4860a;} .vc-c5{border-top-color:#7b5ea7;} .vc-c6{border-top-color:#c0392b;}
.vc-c7{border-top-color:#1a7a5e;} .vc-c8{border-top-color:#2980b9;}
.vocab-expanded{background:var(--panel);border-radius:var(--r);border:1.5px solid var(--border);padding:18px;grid-column:1/-1;border-top:4px solid;}
.ve-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.ve-char-big{font-size:72px;font-weight:900;font-family:'Noto Sans TC',sans-serif;line-height:1;background:var(--bg);border-radius:12px;padding:10px 14px;border:1.5px solid var(--border);}
.ve-meta{flex:1;}
.ve-py{font-size:16px;font-weight:700;color:var(--blue);margin-bottom:4px;}
.ve-zhu{font-size:16px;font-weight:700;color:var(--green);margin-bottom:4px;}
.ve-de{font-size:14px;color:var(--ink2);margin-bottom:8px;}
.ve-stroke-lbl{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.5px;}
.hw-area{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px;}
.hw-box{width:180px;height:180px;flex-shrink:0;}
.ve-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.btn-sm{padding:8px 16px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-play{background:var(--blue);color:#fff;}
.btn-quiz{background:var(--green);color:#fff;}
.btn-close{background:var(--border);color:var(--ink);}
.btn-sm:hover{opacity:.85;transform:translateY(-1px);}
.quiz-status{font-size:12px;font-weight:700;padding:6px 10px;border-radius:6px;margin-top:4px;min-height:28px;}
.quiz-status.ok{background:#e8f8ee;color:#2e8b57;}
.quiz-status.err{background:#fee8e6;color:#d9432a;}
.practice-section{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.practice-lbl{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;}
.practice-row{display:flex;gap:6px;flex-wrap:wrap;}
.practice-cell{width:64px;height:64px;border:1.5px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;}
.practice-cell::before,.practice-cell::after{content:'';position:absolute;background:rgba(58,111,216,.12);}
.practice-cell::before{width:1px;height:100%;left:50%;top:0;}
.practice-cell::after{width:100%;height:1px;top:50%;left:0;}
.guide-char{font-size:40px;opacity:.15;font-family:'Noto Sans TC',sans-serif;}
.practice-note{font-size:10px;color:var(--ink3);margin-top:6px;}
@media(max-width:600px){
  .vocab-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}
  .ve-char-big{font-size:56px;}
  .hw-box{width:160px;height:160px;}
}

.text-zhu{font-size:11px;color:var(--green);letter-spacing:.5px;margin-top:1px;}
.vc-zhu{font-size:11px;color:var(--green);text-align:center;margin-top:2px;}
.ve-zhu{font-size:13px;color:var(--green);margin-top:2px;}
.py-sub{font-size:11px;color:var(--blue);opacity:.85;margin-top:1px;}
</style>
</head>

if (!Array.isArray(SERIES)) { throw new Error("SERIES is not an array: " + typeof SERIES); }

var state = {seriesId:null, bookId:null, lessonId:null, expandedIdx:null, hwWriter:null};
var NUMS = ["\u4e00","\u4e8c","\u4e09","\u56db","\u4e94","\u516d","\u4e03","\u516b","\u4e5d","\u5341","\u5341\u4e00","\u5341\u4e8c"];
var COLORS = ["vc-c1","vc-c2","vc-c3","vc-c4","vc-c5","vc-c6","vc-c7","vc-c8"];

function g(id){ return document.getElementById(id); }

function esc(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function getSeries(){ return SERIES.find(function(x){ return x.id===state.seriesId; }); }
function getBook(){
  var s=getSeries(); return s?s.books.find(function(x){ return x.id===state.bookId; }):null;
}
function getLesson(){
  var b=getBook(); return b?b.lessons.find(function(x){ return x.id===state.lessonId; }):null;
}

function welcome(msg,sub){
  g("content-area").innerHTML="<div class=\"welcome\"><div class=\"w-emoji\">\u270f\ufe0f</div><h2>"+msg+"</h2><p>"+sub+"</p></div>";
}

function init(){
  g("series-row").innerHTML=SERIES.map(function(s){
    return "<button class=\"series-pill"+(state.seriesId===s.id?" active":"")+"\" data-sid=\""+s.id+"\">"+
      s.emoji+" "+esc(s.name)+"<br><span style=\"font-size:10px;font-weight:400;opacity:.7;\">"+esc(s.nameDE)+"</span></button>";
  }).join("");
  g("series-row").onclick=function(e){
    var btn=e.target.closest("[data-sid]");
    if(btn) selectSeries(btn.getAttribute("data-sid"));
  };
}

function selectSeries(id){
  state.seriesId=id; state.bookId=null; state.lessonId=null; state.expandedIdx=null;
  destroyHW(); init(); renderBooks(); renderLessons();
  welcome("W\u00e4hle ein Buch!","\u8acb\u9078\u64c7\u518a\u6578 &middot; Bitte w\u00e4hle ein Buch.");
}

function renderBooks(){
  var tabs=g("book-tabs");
  if(!state.seriesId){tabs.innerHTML="";return;}
  var s=getSeries();
  tabs.innerHTML=s.books.map(function(b){
    return "<button class=\"book-tab"+(state.bookId===b.id?" active":"")+"\" data-bid=\""+b.id+"\">"+
      "<span class=\"t-emoji\">"+b.emoji+"</span>"+esc(b.name)+
      "<span class=\"t-sub\">"+esc(b.nameDE)+"</span></button>";
  }).join("");
  tabs.onclick=function(e){
    var btn=e.target.closest("[data-bid]");
    if(btn) selectBook(btn.getAttribute("data-bid"));
  };
}

function selectBook(id){
  state.bookId=id; state.lessonId=null; state.expandedIdx=null;
  destroyHW(); renderBooks(); renderLessons();
  welcome("W\u00e4hle eine Lektion!","\u8acb\u9ede\u64ca\u8ab2\u7a0b \ud83d\ude0a<br>Klicke auf eine Lektion oben.");
}

function renderLessons(){
  var strip=g("lesson-strip");
  if(!state.seriesId||!state.bookId){
    strip.innerHTML="<div class=\"lesson-strip-label\">\u8acb\u5148\u9078\u64c7\u7cfb\u5217\u548c\u518a\u6578 &middot; Bitte w\u00e4hle Serie und Buch</div>";
    return;
  }
  var b=getBook();
  strip.innerHTML="<div class=\"lesson-strip-label\">\u8ab2\u7a0b &middot; Lektionen</div>"+
    b.lessons.map(function(l){
      return "<button class=\"lesson-btn"+(state.lessonId===l.id?" active":"")+"\" data-lid=\""+l.id+"\">"+
        "\u7b2c"+NUMS[l.id-1]+"\u8ab2&ensp;<span style=\"font-size:10px;opacity:.65;\">"+l.emoji+"</span></button>";
    }).join("");
  strip.onclick=function(e){
    var btn=e.target.closest("[data-lid]");
    if(btn) selectLesson(parseInt(btn.getAttribute("data-lid"),10));
  };
}

function selectLesson(id){
  state.lessonId=id; state.expandedIdx=null;
  destroyHW(); renderLessons(); renderLesson();
}

function renderLesson(){
  var l=getLesson(); if(!l)return;
  g("content-area").innerHTML=
    "<div class=\"lesson-hd\">"+
      "<div class=\"lesson-badge\">"+l.id+"</div>"+
      "<div class=\"lesson-hd-text\">"+
        "<h2>"+esc(l.title)+"</h2>"+
        "<div class=\"py\">"+esc(l.py)+"</div>"+
        "<div class=\"py-sub\">"+esc(l.zhu)+"</div>"+
        "<div class=\"de\">"+esc(l.de)+"</div>"+
      "</div>"+
    "</div>"+
    "<div class=\"lesson-illo\">"+l.emoji+"<p>\u8ab2\u6587\u63d2\u756b &middot; Lektion Illustration</p></div>"+
    "<div class=\"sec-label\">\ud83d\udcda \u8ab2\u6587 &middot; Lektionstext</div>"+
    "<div class=\"lesson-text-box\">"+
      l.text.map(function(t){
        return "<div class=\"text-line\">"+
          "<div class=\"text-zh\">"+esc(t.zh)+"</div>"+
          "<div class=\"text-py\">"+esc(t.py)+"</div>"+
          (t.zhu?"<div class=\"text-zhu\">"+esc(t.zhu)+"</div>":"")+
        "</div>";
      }).join("")+
    "</div>"+
    "<div class=\"sec-label\">\u270f\ufe0f \u751f\u5b57 &middot; Neue Zeichen &amp; Strichreihenfolge</div>"+
    "<div class=\"vocab-grid\" id=\"vocab-grid\">"+
      l.vocab.map(function(v,i){return cardHTML(v,i,false);}).join("")+
    "</div>";
  g("vocab-grid").onclick=function(e){
    var card=e.target.closest("[data-vidx]");
    if(card) toggleVocab(parseInt(card.getAttribute("data-vidx"),10));
  };
}

function cardHTML(v,i,expanded){
  if(expanded)return expandedHTML(v,i);
  return "<div class=\"vocab-card "+COLORS[i%8]+"\" id=\"vc-"+i+"\" data-vidx=\""+i+"\">"+
    "<div class=\"vc-char\">"+esc(v.char)+"</div>"+
    "<div class=\"vc-py\">"+esc(v.py)+"</div>"+
    "<div class=\"vc-zhu\">"+esc(v.zhu)+"</div>"+
    "<div class=\"vc-de\">"+esc(v.de)+"</div>"+
    "<div class=\"vc-hint\">\ud83d\udc47 Strichreihenfolge</div>"+
  "</div>";
}

function expandedHTML(v,i){
  var cells="<div class=\"practice-cell\"><span class=\"guide-char\">"+esc(v.char)+"</span></div>";
  for(var j=0;j<7;j++) cells+="<div class=\"practice-cell\"></div>";
  return "<div class=\"vocab-expanded "+COLORS[i%8]+"\" id=\"vc-"+i+"\" data-vidx=\""+i+"\">"+
    "<div class=\"ve-top\">"+
      "<div class=\"ve-char-big\">"+esc(v.char)+"</div>"+
      "<div class=\"ve-meta\">"+
        "<div class=\"ve-py\">"+esc(v.py)+"</div>"+
        "<div class=\"ve-zhu\">"+esc(v.zhu)+"</div>"+
        "<div class=\"ve-de\">"+esc(v.de)+"</div>"+
        "<div class=\"ve-stroke-lbl\">\u7b46\u9806\u52d5\u756b &middot; Strichreihenfolge-Animation</div>"+
      "</div>"+
    "</div>"+
    "<div class=\"hw-area\">"+
      "<div class=\"hw-box\" id=\"hw-container\">"+
        "<div style=\"width:180px;height:180px;background:#f5f3f0;border-radius:12px;border:1.5px solid #e2ddd8;display:flex;align-items:center;justify-content:center;\">"+
        "<span style=\"color:#bbb;font-size:13px;\">\u8f09\u5165\u4e2d\u2026</span></div>"+
      "</div>"+
      "<div>"+
        "<div class=\"ve-controls\">"+
          "<button class=\"btn-sm btn-play\" id=\"btn-play\">\u25b6 Abspielen</button>"+
          "<button class=\"btn-sm btn-quiz\" id=\"btn-quiz\">\u270f\ufe0f \u00dcben</button>"+
        "</div>"+
        "<div id=\"quiz-status\" class=\"quiz-status\"></div>"+
        "<div style=\"font-size:11px;color:#888;line-height:1.7;max-width:220px;margin-top:8px;\">"+
          "\ud83d\udd34 <strong>Abspielen</strong>: Strichreihenfolge ansehen<br>"+
          "\u270f\ufe0f <strong>\u00dcben</strong>: selbst auf dem Bildschirm schreiben"+
        "</div>"+
      "</div>"+
    "</div>"+
    "<div class=\"practice-section\">"+
      "<div class=\"practice-lbl\">\u270f\ufe0f Schreib\u00fcbung &middot; \u5fb5\u5b57\u7df4\u7fd2\u683c</div>"+
      "<div class=\"practice-row\">"+cells+"</div>"+
      "<div class=\"practice-note\">\ud83d\udca1 Erstes Feld = Vorlage</div>"+
    "</div>"+
    "<button class=\"btn-sm btn-close\" style=\"margin-top:14px;\" id=\"btn-close\">&times; Schlie\u00dfen</button>"+
  "</div>";
}

function toggleVocab(idx){
  destroyHW();
  if(state.expandedIdx===idx){state.expandedIdx=null;renderLesson();return;}
  state.expandedIdx=idx;
  var l=getLesson(); if(!l)return;
  var grid=g("vocab-grid"); if(!grid)return;
  grid.innerHTML=l.vocab.map(function(v,i){return cardHTML(v,i,i===idx);}).join("");
  grid.onclick=function(e){
    // Don't close if clicking buttons or controls inside the expanded card
    if(e.target.closest(".btn-play,.btn-quiz,.btn-close,.ve-controls,.hw-area,.practice-section,.quiz-status")) return;
    var card=e.target.closest("[data-vidx]");
    if(card) toggleVocab(parseInt(card.getAttribute("data-vidx"),10));
  };
  g("btn-play").onclick=function(e){ e.stopPropagation(); playAnim(); };
  g("btn-quiz").onclick=function(e){ e.stopPropagation(); startQuiz(); };
  g("btn-close").onclick=function(e){ e.stopPropagation(); toggleVocab(idx); };
  setTimeout(function(){ initHW(l.vocab[idx].char); },80);
}

function destroyHW(){
  state.hwWriter=null;
  var c=g("hw-container");
  if(c) c.innerHTML="";
}

function initHW(char){
  var c=g("hw-container"); if(!c)return;
  c.innerHTML="";
  try{
    var w=HanziWriter.create(c,char,{
      width:180,height:180,padding:14,
      strokeColor:"#1c2033",radicalColor:"#d9432a",
      highlightColor:"#3a6fd8",outlineColor:"#ccc8c0",
      drawingColor:"#1c2033",drawingWidth:5,
      strokeAnimationSpeed:1.2,delayBetweenStrokes:250,
      showCharacter:true,showOutline:true,showHintAfterMisses:3,
      onLoadCharDataError:function(){
        if(c) c.innerHTML="<div style=\"width:180px;height:180px;background:#fff5f5;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;\">"+
          "<span style=\"font-size:72px;font-family:Noto Sans TC,sans-serif;\">"+char+"</span>"+
          "<span style=\"font-size:10px;color:#d9432a;\">\u7b46\u756b\u8cc7\u6599\u7121\u6cd5\u8f09\u5165</span></div>";
      }
    });
    setTimeout(function(){
      var svg=c.querySelector("svg"); if(!svg)return;
      var ns="http://www.w3.org/2000/svg";
      [[0,90,180,90],[90,0,90,180]].forEach(function(coords){
        var ln=document.createElementNS(ns,"line");
        ln.setAttribute("x1",coords[0]);ln.setAttribute("y1",coords[1]);
        ln.setAttribute("x2",coords[2]);ln.setAttribute("y2",coords[3]);
        ln.setAttribute("stroke","rgba(58,111,216,0.18)");
        ln.setAttribute("stroke-width","1");
        ln.setAttribute("stroke-dasharray","4,4");
        svg.insertBefore(ln,svg.firstChild);
      });
      var r=document.createElementNS(ns,"rect");
      r.setAttribute("x","1");r.setAttribute("y","1");
      r.setAttribute("width","178");r.setAttribute("height","178");
      r.setAttribute("fill","none");r.setAttribute("stroke","#ccc8c0");
      r.setAttribute("stroke-width","1.5");r.setAttribute("rx","12");
      svg.insertBefore(r,svg.firstChild);
    },120);
    state.hwWriter=w;
  }catch(e){
    if(c) c.innerHTML="<div style=\"width:180px;height:180px;background:#f5f3f0;border-radius:12px;display:flex;align-items:center;justify-content:center;\">"+
      "<span style=\"font-size:80px;font-family:Noto Sans TC,sans-serif;\">"+char+"</span></div>";
  }
}

function playAnim(){ if(state.hwWriter) state.hwWriter.animateCharacter(); }
function startQuiz(){
  if(!state.hwWriter)return;
  var st=g("quiz-status");
  if(st){st.className="quiz-status";st.innerHTML="\u270f\ufe0f Schreibe den Strich nach!";}
  state.hwWriter.quiz({
    onMistake:function(d){if(st){st.className="quiz-status err";st.innerHTML="&times; Fehler bei Strich "+(d.strokeNum+1);}},
    onCorrectStroke:function(d){if(st){st.className="quiz-status ok";st.innerHTML="\u2713 Strich "+(d.strokeNum+1)+" richtig!";}},
    onComplete:function(d){if(st){st.className="quiz-status ok";st.innerHTML="\ud83c\udf89 Alle Striche richtig! Fehler: "+d.totalMistakes;}}
  });
}

init();

</script>
</body>
</html>
