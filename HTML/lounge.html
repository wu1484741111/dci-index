<head>
<meta charset="utf-8">

<title>Lounge · 3D 聊天世界</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:system-ui,"Noto Sans TC",sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;font-size:13px;background:#0008;padding:6px 10px;border-radius:8px;pointer-events:none;line-height:1.5}
#toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:#000a;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .4s;pointer-events:none}
#log{position:fixed;left:10px;bottom:calc(64px + env(safe-area-inset-bottom));width:min(420px,70vw);font-size:14px;pointer-events:none}
#log div{background:#000a;padding:4px 9px;margin-top:3px;border-radius:6px;word-break:break-word}
#log b{color:#ffd37a}
#cf{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:6px;max-width:520px}
#msg{flex:1;padding:11px 12px;border-radius:10px;border:1px solid #fff4;background:#000a;color:#fff;font-size:16px}
button{padding:0 16px;border-radius:10px;border:0;background:#ffd37a;color:#201400;font-weight:700;font-size:15px}
#joy{position:fixed;left:24px;bottom:calc(90px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:#fff2;border:1px solid #fff4;display:none;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#fffa}
#jump{position:fixed;right:24px;bottom:calc(110px + env(safe-area-inset-bottom));width:72px;height:72px;border-radius:50%;display:none}
@media (pointer:coarse){#joy,#jump{display:block}}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0b1020cc,#1b2a4acc);z-index:5}
#start form{width:min(360px,88vw);display:flex;flex-direction:column;gap:12px}
#start h1{margin:0;font-size:30px}
#start p{margin:0;color:#cfd8f0;font-size:14px;line-height:1.6}
#start input{padding:13px;border-radius:10px;border:0;font-size:17px}
#start button{padding:13px;font-size:17px}
#mm{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;gap:6px}
#mm button{width:44px;height:44px;font-size:20px;padding:0;background:#000a;color:#fff}#mm .on{background:#3ddc84;color:#000}
#vids{position:fixed;top:64px;right:10px;display:flex;flex-direction:column;gap:6px}#vids video{width:120px;border-radius:8px;background:#000}#vids .self{transform:scaleX(-1)}
#hint{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000a;padding:6px 14px;border-radius:16px;font-size:14px;pointer-events:none;display:none}
#acts{position:fixed;right:14px;bottom:calc(190px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:8px}#acts button{padding:10px 12px}
@media (pointer:coarse){#acts{display:flex}}
#avs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}#avs button{padding:10px 4px;background:#ffffff22;color:#fff;font-weight:400}#avs .on{background:#ffd37a;color:#201400;font-weight:700}#start label{font-size:14px;color:#cfd8f0}#hue{width:100%;accent-color:#ffd37a}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>

<body>
<canvas id="cv"></canvas>
<div id="hud"></div><div id="toast"></div><div id="log"></div>
<form id="cf" autocomplete="off"><input id="msg" maxlength="120" placeholder="說點什麼…（Enter 開始輸入）"><button>送出</button></form>
<div id="joy"><div id="knob"></div></div><button id="jump">跳</button>
<div id="vids"></div><div id="mm"><button id="mic" title="麥克風">🎤</button><button id="cam" title="鏡頭">📷</button></div><div id="hint"></div>
<div id="acts"><button data-k="E">E 互動</button><button data-k="F">F 釣魚</button><button data-k="G">G 丟</button><button data-k="V">V 視角</button></div>
<div id="start"><form id="sf">
<h1>Lounge</h1>
<p>一個大型的程序生成世界：海洋、沙漠、森林、雪山，還有 12 顆隱藏水晶。朋友打開網址就能一起逛、一起聊，不需要登入。<br>電腦：點畫面鎖定滑鼠，WASD 移動，空白鍵跳，Shift 跑，Enter 聊天，E 坐下／撿東西，G 丟，F 釣魚（面向水面），V 切換第三人稱看自己。右上角可開麥克風與鏡頭，越近聲音越大。手機：左搖桿移動，右側拖曳轉視角。</p>
<input id="nm" maxlength="16" placeholder="你的暱稱" required>
<div id="avs"></div><label>顏色 <input type="range" id="hue" min="0" max="359" value="200"></label>
<button>進入世界</button>
</form></div>

<script type="module">
import * as THREE from 'three';

/* ---------- 確定性隨機與地形（所有人看到同一個世界） ---------- */
const hs=(x,y)=>{let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+1013904223)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296};
const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 return hs(xi,yi)*(1-u)*(1-v)+hs(xi+1,yi)*u*(1-v)+hs(xi,yi+1)*(1-u)*v+hs(xi+1,yi+1)*u*v};
const fbm=(x,y,o=5)=>{let a=.5,s=0,f=1;for(let i=0;i<o;i++){s+=a*vn(x*f,y*f);f*=2;a/=2}return s};
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rnd=mulberry(20261015);
const M=(x,z)=>fbm(x/180-50,z/180+30,4);
const LX=150,LZ=-60,LR=55;
const H=(x,z)=>{let h=(fbm(x/260+3,z/260+7)-.5)*110;const m=Math.max(0,fbm(x/120+40,z/120-20)-.52);h+=m*230;
 const d=Math.hypot(x,z),k=Math.min(1,Math.max(0,(70-d)/40));h=h*(1-k)+6*k;const ld=Math.hypot(x-LX,z-LZ),k2=Math.min(1,Math.max(0,(LR+30-ld)/30)),t=Math.min(2.5,-6+8.5*(ld/LR)**2);return h*(1-k2)+t*k2};

/* ---------- 場景 ---------- */
const cv=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,1,.1,900);
const hemi=new THREE.HemisphereLight(0xffffff,0x445533,1.1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d0,1.6);scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const S=1600,N=320;
const tg=new THREE.PlaneGeometry(S,S,N,N);tg.rotateX(-Math.PI/2);
{const p=tg.attributes.position,cl=new Float32Array(p.count*3),c=new THREE.Color();
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),h=H(x,z),m=M(x,z);p.setY(i,h);
  if(h<1.8||Math.hypot(x-LX,z-LZ)<LR+14)c.set(0xd9c88a);else if(h>78)c.set(0xf4f7ff);else if(h>52)c.set(0x7d7a78);
  else if(m<.42&&h<34)c.set(0xcfa955);else if(m>.55)c.set(0x2f6b34);else c.set(0x5c9a45);
  c.multiplyScalar(.9+hs(i,7)*.2);cl.set([c.r,c.g,c.b],i*3)}
 tg.setAttribute('color',new THREE.BufferAttribute(cl,3));tg.computeVertexNormals()}
scene.add(new THREE.Mesh(tg,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true})));
const water=new THREE.Mesh(new THREE.PlaneGeometry(S*2,S*2).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0x2a6fb5,transparent:true,opacity:.78}));
scene.add(water);

/* ---------- 樹、仙人掌、岩石 ---------- */
const dm=new THREE.Object3D(),col=new THREE.Color();
const mk=(g,c,n)=>{const m=new THREE.InstancedMesh(g,new THREE.MeshLambertMaterial({color:c,flatShading:true}),n);m.count=0;scene.add(m);return m};
const trunk=mk(new THREE.CylinderGeometry(.4,.5,3,6),0x5a3d22,8000),crown=mk(new THREE.ConeGeometry(2.6,7,7),0xffffff,8000),
 cactus=mk(new THREE.CylinderGeometry(.6,.7,4,7),0x4a8c4a,1800),rock=mk(new THREE.DodecahedronGeometry(1.6),0x8a8886,1500);
const put=(m,x,y,z,s,ry=0)=>{dm.position.set(x,y,z);dm.scale.setScalar(s);dm.rotation.y=ry;dm.updateMatrix();m.setMatrixAt(m.count++,dm.matrix)};
for(let i=0;i<60000&&trunk.count<8000;i++){
 const x=(rnd()-.5)*S*.96,z=(rnd()-.5)*S*.96,h=H(x,z),m=M(x,z),s=.7+rnd()*1.2;
 if(h<2||h>60||Math.hypot(x,z)<35||Math.hypot(x-LX,z-LZ)<LR+25)continue;
 if(m>.5&&h<48&&rnd()<.5){put(trunk,x,h+1.5*s,z,s);col.setHSL(.28+rnd()*.08,.5,.2+rnd()*.1);crown.setColorAt(crown.count,col);put(crown,x,h+6.2*s,z,s)}
 else if(m<.42&&h<34&&cactus.count<1800&&rnd()<.05)put(cactus,x,h+2*s,z,s);
 else if(rock.count<1500&&rnd()<.02)put(rock,x,h+.5*s,z,s,rnd()*6);
}
for(const m of[trunk,crown,cactus,rock]){m.instanceMatrix.needsUpdate=true}
crown.instanceColor.needsUpdate=true;

/* 出生廣場：燈塔與石圈 */
const bh=H(0,0);
const pillar=new THREE.Mesh(new THREE.CylinderGeometry(.8,1.2,16,8),new THREE.MeshBasicMaterial({color:0xffc060}));pillar.position.set(0,bh+8,0);scene.add(pillar);
for(let i=0;i<10;i++){const a=i/10*6.283;put(rock,Math.cos(a)*9,bh+.4,Math.sin(a)*9,1.3,a);}
rock.instanceMatrix.needsUpdate=true;

/* ---------- 12 顆隱藏水晶 ---------- */
const cand={peak:[],desert:[],forest:[]};
for(let i=0;i<6000;i++){const x=(rnd()-.5)*S*.9,z=(rnd()-.5)*S*.9,h=H(x,z),m=M(x,z);
 if(h>70)cand.peak.push([x,z,h]);else if(m<.4&&h>3&&h<30)cand.desert.push([x,z,h]);else if(m>.6&&h>3&&h<45)cand.forest.push([x,z,h])}
const crystals=[];
for(const[k,n]of[['peak',4],['desert',4],['forest',4]]){const a=cand[k];for(let i=0;i<n&&a.length;i++){
 const[x,z,h]=a.splice(Math.floor(rnd()*a.length),1)[0],g=new THREE.Group(),c=new THREE.Color().setHSL(crystals.length/12,.9,.6);
 const gem=new THREE.Mesh(new THREE.OctahedronGeometry(1.3),new THREE.MeshBasicMaterial({color:c}));gem.position.y=3;
 const beam=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,70,6),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.35}));beam.position.y=35;
 g.add(gem,beam);g.position.set(x,h,z);scene.add(g);crystals.push({g,gem,beam,x,z,h,got:false})}}

/* ---------- 度假區：碼頭、椅子、可撿物件、釣魚、語音視訊 ---------- */
const wood=new THREE.MeshLambertMaterial({color:0x9a6b3c});
const ul=Math.hypot(LX,LZ),ux=-LX/ul,uz=-LZ/ul,dth=Math.atan2(ux,uz),cx=LX+ux*48,cz=LZ+uz*48,sd=Math.sin(dth),cd=Math.cos(dth);
const dock=new THREE.Mesh(new THREE.BoxGeometry(3,.3,22),wood);dock.position.set(cx,.5,cz);dock.rotation.y=dth;scene.add(dock);
const G=(x,z)=>{const dx=x-cx,dz=z-cz;return Math.abs(dx*cd-dz*sd)<1.5&&Math.abs(dx*sd+dz*cd)<11?Math.max(H(x,z),.65):H(x,z)};
const chairs=[],items=[],vv=new Map();let sitting=null,held=null,fish=null,fishes=0,sendI=()=>{},R=null,stream=null,mode=0,ia=0;
function chair(x,z,fx,fz){const g=new THREE.Group(),h=G(x,z),a=(w,hh,d,y,zz)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,hh,d),wood);m.position.set(0,y,zz);g.add(m)};
 a(1.2,.15,1.2,.6,0);a(1.2,1,.15,1.1,.55);a(.2,.6,.2,.3,0);const th=Math.atan2(-(fx-x),-(fz-z));g.position.set(x,h,z);g.rotation.y=th;scene.add(g);chairs.push({x,z,y:h+.6,th})}
for(let i=0;i<6;i++){const a=i/6*6.283;chair(Math.cos(a)*5,Math.sin(a)*5,0,0)}
for(const o of[-9,9])chair(LX+ux*(LR+9)-uz*o,LZ+uz*(LR+9)+ux*o,LX,LZ);
chair(LX+ux*(LR-15),LZ+uz*(LR-15),LX,LZ);
const IT=[[0xff4d4d,.6,.7,0,13],[0x4d9aff,.6,.7,2.1,13],[0xffd34d,.6,.7,4.2,13],[0xb06cff,.45,.15,0,0],[0xffe9a0,.35,.2,0,0]];
IT.forEach((q,i)=>{const m=new THREE.Mesh(i==3?new THREE.BoxGeometry(.9,.9,.9):new THREE.SphereGeometry(q[1],14,10),new THREE.MeshLambertMaterial({color:q[0],emissive:i==4?q[0]:0}));
 const x=i<3?Math.cos(q[3])*q[4]:i==3?LX+ux*(LR+12):3,z=i<3?Math.sin(q[3])*q[4]:i==3?LZ+uz*(LR+12):3;m.position.set(x,G(x,z)+q[1],z);scene.add(m);
 items.push({m,v:new THREE.Vector3(),b:q[2],r:q[1],id:i,mine:false,rest:0})});
const bob=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),new THREE.MeshBasicMaterial({color:0xff3030}));bob.visible=false;scene.add(bob);
const FISH=[['小鯉魚',18,40,.4],['虹鱒',30,60,.3],['鯰魚',40,90,.18],['金魚',8,15,.1],['傳說金鯉魚',90,140,.02]];
const waterAhead=()=>{const x=me.x-Math.sin(me.yaw)*6,z=me.z-Math.cos(me.yaw)*6;return G(x,z)<-.8?{x,z}:null};
function fishAct(){if(document.activeElement===msg||sitting)return;
 if(fish){if(fish.bite){let r=Math.random(),f=FISH[0];for(const q of FISH){if(r<q[3]){f=q;break}r-=q[3]}
  const t=`🎣 釣到了 ${f[0]}（${Math.round(f[1]+Math.random()*(f[2]-f[1]))} cm）`;fishes++;toast(t);sendC(t);addLog(me.name,t)}else toast('太早收竿，魚嚇跑了');fish=null;bob.visible=false;return}
 const p=waterAhead();if(!p){toast('面向水面（湖或海）再甩竿');return}
 fish={x:p.x,z:p.z,t:0,w:3+Math.random()*6,bite:false,bt:0};bob.visible=true;toast('拋竿…等魚上鉤')}
function drop(s){if(!held)return;const d=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);held.v.copy(d).multiplyScalar(s);if(s)held.v.y+=4;held=null}
const throwAct=()=>{if(document.activeElement!==msg)drop(13)};
function act(){if(document.activeElement===msg)return;
 if(sitting){sitting=null;return}if(held){drop(2);return}
 let bi=null,bd=3.5;for(const c of chairs){const d=Math.hypot(c.x-me.x,c.z-me.z);if(d<bd){bd=d;bi=c}}
 let ii=null,id=4;for(const it of items){const d=it.m.position.distanceTo(camera.position);if(d<id){id=d;ii=it}}
 if(ii&&id<=bd+.5){held=ii;ii.mine=true;ii.v.set(0,0,0);toast('撿起了物品（G 丟出）')}
 else if(bi){sitting=bi;me.yaw=bi.th;toast('坐下了，移動即可起身')}}
const hintEl=document.getElementById('hint'),vids=document.getElementById('vids'),micB=document.getElementById('mic'),camB=document.getElementById('cam');
const selfV=document.createElement('video');selfV.muted=true;selfV.autoplay=true;selfV.playsInline=true;selfV.className='self';selfV.style.display='none';vids.append(selfV);
async function setMode(m){if(!R){toast('連線服務尚未就緒');return}
 if(stream){R.removeStream(stream);stream.getTracks().forEach(t=>t.stop());stream=null;selfV.srcObject=null;selfV.style.display='none'}mode=0;
 if(m){try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:m==2?{width:320,height:240}:false});
  R.addStream(stream);mode=m;if(m==2){selfV.srcObject=stream;selfV.style.display='block'}toast(m==2?'鏡頭與麥克風已開啟':'麥克風已開啟（越近越大聲）')}
  catch(e){toast('無法使用麥克風/鏡頭，請允許瀏覽器權限')}}
 micB.classList.toggle('on',mode>0);camB.classList.toggle('on',mode==2)}
micB.onclick=()=>setMode(mode==1?0:1);camB.onclick=()=>setMode(mode==2?0:2);
document.querySelectorAll('#acts button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();({E:act,F:fishAct,G:throwAct,V:()=>{tp=!tp}})[b.dataset.k]()}));
function tick(dt,now){
 if(held)held.m.position.set(.5,-.45,-1.3).applyQuaternion(camera.quaternion).add(camera.position);
 for(const it of items){if(!it.mine||it===held)continue;const p=it.m.position,v=it.v;v.y-=20*dt;p.addScaledVector(v,dt);const g=G(p.x,p.z)+it.r;
  if(p.y-it.r<0&&g-it.r<0){v.y+=45*dt*Math.min(1,-(p.y-it.r));v.multiplyScalar(1-1.5*dt)}
  if(p.y<g){p.y=g;v.y=-v.y*it.b;v.x*=.85;v.z*=.85;if(Math.abs(v.y)<1.2)v.y=0}
  if(v.lengthSq()<.02){it.rest+=dt;if(it.rest>3)it.mine=false}else it.rest=0}
 ia+=dt;if(ia>.1){ia=0;if(online)for(const it of items)if(it.mine){const p=it.m.position;sendI([it.id,p.x,p.y,p.z])}}
 if(fish){fish.t+=dt;if(Math.hypot(fish.x-me.x,fish.z-me.z)>14||sitting){fish=null;bob.visible=false}
  else{if(!fish.bite&&fish.t>fish.w){fish.bite=true;fish.bt=0;toast('🐟 有魚上鉤！快按 F')}
   if(fish.bite){fish.bt+=dt;if(fish.bt>2){toast('魚跑掉了…');fish=null;bob.visible=false}}
   if(fish)bob.position.set(fish.x,.05+Math.sin(now/300)*.05-(fish.bite?.25:0),fish.z)}}
 let h='';if(sitting)h='移動即可起身';else if(held)h='G 丟出　E 放下';else if(fish)h=fish.bite?'F 收竿！':'等魚上鉤…（F 收竿）';
 else{for(const c of chairs)if(Math.hypot(c.x-me.x,c.z-me.z)<3.5)h='E 坐下';for(const it of items)if(it.m.position.distanceTo(camera.position)<4)h='E 撿起';if(!h&&waterAhead())h='F 釣魚'}
 hintEl.textContent=h;hintEl.style.display=h?'block':'none';
 for(const[id,v]of vv){const a=peers.get(id),d=a?Math.hypot(a.g.position.x-me.x,a.g.position.z-me.z):99,s=v.srcObject;v.volume=Math.max(0,Math.min(1,1.3-d/45));
  v.style.display=s&&s.getVideoTracks().some(t=>t.readyState==='live'&&!t.muted)?'block':'none'}}

/* ---------- 玩家 ---------- */
const me={x:(Math.random()-.5)*16,y:bh+2,z:4+(Math.random()-.5)*16,vy:0,yaw:0,pitch:0,name:'',hue:0};
const keys={};let jx=0,jy=0,jumpReq=false,found=0;
const msg=document.getElementById('msg'),hud=document.getElementById('hud'),logEl=document.getElementById('log'),toastEl=document.getElementById('toast');
addEventListener('keydown',e=>{if(document.activeElement===msg){if(e.key==='Escape')msg.blur();return}
 if(e.key==='Enter'){e.preventDefault();msg.focus();return}keys[e.code]=1;if(!e.repeat){if(e.code==='KeyE')act();if(e.code==='KeyF')fishAct();if(e.code==='KeyG')throwAct();if(e.code==='KeyV')tp=!tp}if(e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=0});
let lk=null;const clampP=()=>{me.pitch=Math.max(-1.4,Math.min(1.4,me.pitch))};
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')cv.requestPointerLock?.();else lk={id:e.pointerId,x:e.clientX,y:e.clientY}});

const joy=document.getElementById('joy'),knob=document.getElementById('knob');
const jset=e=>{const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-60,dy=e.clientY-r.top-60,l=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
 jx=Math.cos(a)*l/50;jy=Math.sin(a)*l/50;knob.style.left=40+jx*50+'px';knob.style.top=40+jy*50+'px'};

function spr(w,h,sx,sy){const c=document.createElement('canvas');c.width=w;c.height=h;
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));
 s.scale.set(sx,sy,1);s.renderOrder=9;s.userData={c};return s}
function paint(s,txt,bg,fs){const c=s.userData.c,x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
 if(!txt){s.visible=false;return}x.font=`bold ${fs}px system-ui,sans-serif`;
 const w=Math.min(c.width-4,x.measureText(txt).width+36),l=(c.width-w)/2,t=8,h=c.height-16;
 x.fillStyle=bg;x.beginPath();x.roundRect(l,t,w,h,h/2.4);x.fill();x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';
 x.fillText(txt,c.width/2,c.height/2,c.width-40);s.material.map.needsUpdate=true;s.visible=true}

 if(t==0){P(cap,c,0,.85,0);P(sp,0xffe0c0,0,1.8,0,.33);eyes(1.85,-.3)}
 else if(t==1){P(cap,c,0,.85,0);P(sp,c,0,1.8,0,.36);for(const k of[-1,1])P(cn,c,k*.2,2.18,0,1.6);eyes(1.85,-.33);P(sp,0xffa0b8,0,1.76,-.35,.04)}
 else if(t==2){P(sp,c,0,.85,0,.5,.72,.45);P(sp,c,0,1.8,0,.4);for(const k of[-1,1])P(sp,c,k*.3,2.13,0,.14);P(sp,0xf5deb3,0,1.72,-.34,.16,.12,.1);P(sp,0x222222,0,1.78,-.43,.05);eyes(1.88,-.35,.14,.045)}
 else if(t==3){P(bx,c,0,.8,0,.8,1.2,.5);P(bx,0xbfc8d6,0,1.75,0,.6,.5,.5);for(const k of[-1,1]){P(sp,0x00e5ff,k*.14,1.78,-.26,.07);P(bx,0x555a6a,k*.2,.1,0,.2,.3,.2)}
  P(new THREE.CylinderGeometry(.03,.03,.3,6),0x888888,0,2.15,0);P(sp,0xff3030,0,2.33,0,.07)}
 else if(t==4){P(sp,0x2a2f45,0,.85,0,.5,.75,.45);P(sp,0xffffff,0,.8,-.17,.38,.6,.3);P(sp,0x2a2f45,0,1.8,0,.33);P(cn,0xff9a1f,0,1.75,-.33,1.2).rotation.x=-Math.PI/2;eyes(1.87,-.28,.12,.04);
  P(new THREE.TorusGeometry(.3,.07,6,12),c,0,1.5,0).rotation.x=Math.PI/2;for(const k of[-1,1])P(bx,0xff9a1f,k*.2,.05,-.1,.22,.08,.3)}
 else{P(sp,c,0,.8,0,.5,.65,.5);P(sp,c,0,1.7,0,.4,.3,.38);for(const k of[-1,1]){P(sp,0xffffff,k*.2,2,-.12,.13);P(sp,0x111111,k*.2,2.02,-.24,.06)}}
 return g}
function avatar(name,t,hue){const g=new THREE.Group(),nm=spr(512,96,5.3,1),bb=spr(512,112,6,1.3);nm.position.y=2.7;bb.position.y=3.5;paint(nm,name,'#000a',44);paint(bb,'','#fff',0);

let selAv=0,selfAv=null,tp=false;
const avs=document.getElementById('avs'),hueEl=document.getElementById('hue');
AVN.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.onclick=()=>{selAv=i;[...avs.children].forEach((c,j)=>c.classList.toggle('on',j==i))};avs.append(b)});

 b.textContent=who+'：';d.append(b,document.createTextNode(text));logEl.append(d);while(logEl.children.length>8)logEl.firstChild.remove();

/* ---------- 網路：Trystero（WebRTC 點對點，無需伺服器與登入） ---------- */
let sendS=()=>{},sendC=()=>{},online=false,rl=-1;
const RELAYS=['wss://relay.damus.io','wss://nos.lol','wss://relay.snort.social','wss://nostr.mom','wss://relay.primal.net','wss://offchain.pub','wss://nostr.oxtr.dev','wss://relay.nostr.band'];
async function net(){
 try{
  const{joinRoom,getRelaySockets}=await import('https://cdn.jsdelivr.net/npm/trystero@0.21.5/+esm');
  const room=joinRoom({appId:'dci-index-lounge-2026',relayUrls:RELAYS},'main');
  setInterval(()=>{try{rl=Object.values(getRelaySockets()).filter(x=>x.readyState===1).length}catch(_){}},2000);
  setTimeout(()=>{if(rl===0)toast('連不到中繼伺服器，朋友可能找不到你（換網路試試）')},10000);
  const[s1,g1]=room.makeAction('st'),[s2,g2]=room.makeAction('ch');
  sendS=s1;sendC=s2;online=true;R=room;const[s3,g3]=room.makeAction('it');sendI=s3;
  g3(d=>{if(!Array.isArray(d))return;const it=items[d[0]];if(!it||it===held)return;it.mine=false;it.m.position.set(+d[1]||0,+d[2]||0,+d[3]||0)});
  room.onPeerStream((s,id)=>{let v=vv.get(id);if(!v){v=document.createElement('video');v.autoplay=true;v.playsInline=true;vids.append(v);vv.set(id,v)}v.srcObject=s;v.play?.().catch(()=>{})});
  const st=()=>[me.x,me.y,me.z,me.yaw,me.name,me.av,me.hue];
  room.onPeerJoin(id=>{s1(st(),id);if(stream)room.addStream(stream,id)});
  room.onPeerLeave(id=>{const v=vv.get(id);if(v){v.remove();vv.delete(id)}const a=peers.get(id);if(a){scene.remove(a.g);peers.delete(id)}});
  g1((d,id)=>{if(!Array.isArray(d))return;const name=String(d[4]||'旅人').slice(0,16);let a=peers.get(id);
   const ty=Math.max(0,Math.min(5,(+d[5])|0)),hu=((+d[6])|0)%360;if(!a){a=avatar(name,ty,hu);a.g.position.set(+d[0],+d[1],+d[2]);peers.set(id,a)}else if(a.type!==ty||a.hue!==hu)setBody(a,ty,hu);
   if(a.name!==name){a.name=name;paint(a.nm,name,'#000a',44)}
   a.tx=+d[0]||0;a.ty=+d[1]||0;a.tz=+d[2]||0;a.yaw=+d[3]||0});
  g2((t,id)=>{const a=peers.get(id);t=String(t).slice(0,120);addLog(a?a.name:'旅人',t);if(a)bubble(a,t)});
 }catch(e){toast('連線服務載入失敗，目前是單人模式')}
}

function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!me.name){renderer.render(scene,camera);return}
 const typing=document.activeElement===msg;
 let fx=(typing?0:(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0))+jx,

 me.vy-=25*dt;me.y+=me.vy*dt;if(me.y<floor){me.y=floor;me.vy=0}
 if(sitting){me.x=sitting.x;me.z=sitting.z;me.y=sitting.y+1.3;me.vy=0}
 camera.position.set(me.x,me.y,me.z);camera.rotation.set(me.pitch,me.yaw,0,'YXZ');
 if(selfAv){selfAv.visible=tp;if(tp){selfAv.position.set(me.x,me.y-1.7,me.z);selfAv.rotation.y=me.yaw;camera.position.add(new THREE.Vector3(0,.7,4.5).applyEuler(camera.rotation));camera.position.y=Math.max(camera.position.y,H(camera.position.x,camera.position.z)+.6)}}
