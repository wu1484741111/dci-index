<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>華語學習 · Chinesisch Lernen</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<style>
:root {
  --bg: #f7f3ee;
  --panel: #ffffff;
  --ink: #1c2033;
  --ink2: rgba(28,32,51,0.55);
  --ink3: rgba(28,32,51,0.28);
  --red: #d9432a;
  --gold: #e8a020;
  --blue: #3a6fd8;
  --green: #2e8b57;
  --border: #e2ddd8;
  --shadow: 0 2px 16px rgba(28,32,51,0.09);
  --r: 14px;
}
* { box-sizing: border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  font-family:'Nunito','Noto Sans TC',sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
}
 
/* ── HEADER ── */
.app-header {
  background:var(--ink);
  padding:14px 20px;
  display:flex; align-items:center; gap:12px;
  position:sticky; top:0; z-index:200;
  box-shadow:0 2px 12px rgba(0,0,0,0.25);
}
.app-header .logo { font-size:24px; }
.app-header h1 { color:#fff; font-size:17px; font-weight:800; line-height:1.2; }
.app-header h1 small { display:block; font-size:11px; font-weight:400; color:rgba(255,255,255,0.5); letter-spacing:.5px; }
 
/* ── 3-LEVEL NAV ── */
.nav-wrapper { max-width:860px; margin:0 auto; padding:16px 16px 0; }
 
/* Level 1: Series pills */
.series-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.series-pill {
  padding:8px 18px; border-radius:50px;
  border:2px solid var(--border); background:var(--panel);
  font-size:13px; font-weight:700; cursor:pointer;
  transition:all .2s; color:var(--ink2);
}
.series-pill:hover { border-color:var(--blue); color:var(--blue); }
.series-pill.active { background:var(--ink); color:#fff; border-color:var(--ink); }
 
/* Level 2: Book tabs */
.book-tabs {
  display:flex; gap:0; background:var(--panel);
  border-radius:var(--r) var(--r) 0 0;
  border:2px solid var(--border); border-bottom:none;
  overflow:hidden;
}
.book-tab {
  flex:1; padding:12px 8px; text-align:center; cursor:pointer;
  font-size:13px; font-weight:700; color:var(--ink2);
  border-right:1px solid var(--border);
  transition:all .2s; background:transparent;
}
.book-tab:last-child { border-right:none; }
.book-tab:hover { color:var(--ink); background:rgba(28,32,51,0.04); }
.book-tab.active { background:var(--bg); color:var(--ink); position:relative; }
.book-tab.active::after {
  content:''; position:absolute; bottom:-2px; left:0; right:0; height:2px;
  background:var(--bg);
}
.book-tab .t-emoji { font-size:18px; display:block; margin-bottom:2px; }
.book-tab .t-sub { font-size:10px; font-weight:400; color:var(--ink3); }
 
/* ── MAIN PANEL ── */
.main-panel {
  max-width:860px; margin:0 auto;
  background:var(--bg);
  border:2px solid var(--border); border-top:none;
  border-radius:0 0 var(--r) var(--r);
  overflow:hidden;
}
 
/* Level 3: Lesson buttons */
.lesson-strip {
  background:var(--panel);
  padding:14px 16px 12px;
  border-bottom:2px solid var(--border);
  display:flex; flex-wrap:wrap; gap:7px; align-items:center;
}
.lesson-strip-label {
  font-size:10px; font-weight:800; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--ink3);
  width:100%; margin-bottom:2px;
}
.lesson-btn {
  padding:7px 13px; border-radius:50px;
  border:1.5px solid var(--border); background:var(--panel);
  font-size:12px; font-weight:700; color:var(--ink2);
  cursor:pointer; transition:all .2s;
  display:flex; align-items:center; gap:5px;
}
.lesson-btn:hover { border-color:var(--blue); color:var(--blue); transform:translateY(-1px); }
.lesson-btn.active { background:var(--red); color:#fff; border-color:var(--red); box-shadow:0 3px 10px rgba(217,67,42,0.3); }
.lesson-btn .l-num { font-family:'Noto Sans TC',sans-serif; font-size:13px; }
 
/* ── CONTENT AREA ── */
.content-area { padding:24px 20px 40px; }
 
/* Welcome screen */
.welcome {
  text-align:center; padding:60px 20px;
  color:var(--ink2);
}
.welcome .w-emoji { font-size:56px; margin-bottom:16px; }
.welcome h2 { font-size:20px; font-weight:800; color:var(--ink); margin-bottom:8px; }
.welcome p { font-size:14px; line-height:1.7; }
 
/* Lesson header */
.lesson-hd {
  display:flex; align-items:flex-start; gap:16px; margin-bottom:20px;
}
.lesson-badge {
  width:56px; height:56px; border-radius:14px;
  background:var(--ink); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:22px; font-weight:900; flex-shrink:0;
  font-family:'Noto Sans TC',sans-serif;
}
.lesson-hd-text h2 {
  font-size:26px; font-weight:900;
  font-family:'Noto Sans TC',sans-serif; line-height:1.2;
}
.lesson-hd-text .py { color:var(--red); font-size:13px; font-weight:700; margin-top:3px; }
.lesson-hd-text .de { color:var(--ink2); font-size:12px; font-style:italic; margin-top:2px; }
 
/* Illustration */
.lesson-illo {
  background:linear-gradient(135deg,#fff7f0,#f0f4ff);
  border:1.5px dashed var(--border); border-radius:16px;
  padding:28px; text-align:center;
  font-size:72px; line-height:1;
  margin-bottom:22px;
}
.lesson-illo p { font-size:11px; color:var(--ink3); margin-top:8px; }
 
/* Section label */
.sec-label {
  font-size:10px; font-weight:800; letter-spacing:1.8px;
  text-transform:uppercase; color:var(--ink3);
  display:flex; align-items:center; gap:8px;
  margin-bottom:12px;
}
.sec-label::after { content:''; flex:1; height:1px; background:var(--border); }
 
/* Text block */
.lesson-text-box {
  background:var(--panel); border-radius:12px;
  border:1.5px solid var(--border);
  padding:18px 22px; margin-bottom:24px;
}
.text-line { margin-bottom:14px; }
.text-line:last-child { margin-bottom:0; }
.text-zh {
  font-family:'Noto Sans TC',sans-serif;
  font-size:19px; line-height:1.7; color:var(--ink);
}
.text-py { font-size:12px; color:var(--red); margin-top:2px; font-family:'Noto Sans TC',sans-serif; }
 
/* Vocab grid */
.vocab-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px; margin-bottom:6px;
}
.vocab-card {
  background:var(--panel); border-radius:12px;
  border:1.5px solid var(--border);
  padding:14px 12px; cursor:pointer;
  transition:all .22s; position:relative; overflow:hidden;
  text-align:left;
}
.vocab-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  border-radius:12px 12px 0 0;
}
.vc-c1::before{background:#d9432a;}
.vc-c2::before{background:#3a6fd8;}
.vc-c3::before{background:#2e8b57;}
.vc-c4::before{background:#e8a020;}
.vc-c5::before{background:#7c5ccc;}
.vc-c6::before{background:#d64d8a;}
.vc-c7::before{background:#0099aa;}
.vc-c8::before{background:#e07030;}
 
.vocab-card:hover { border-color:var(--blue); transform:translateY(-2px); box-shadow:0 6px 20px rgba(58,111,216,0.15); }
.vc-char {
  font-family:'Noto Sans TC',sans-serif;
  font-size:32px; font-weight:700; line-height:1.1;
  margin-bottom:4px; color:var(--ink);
}
.vc-py { font-size:12px; color:var(--red); font-weight:600; font-family:'Noto Sans TC',sans-serif; }
.vc-de { font-size:11px; color:var(--ink2); font-style:italic; margin-top:2px; }
.vc-hint { font-size:9px; color:var(--ink3); margin-top:8px; }
 
/* ── EXPANDED VOCAB ── */
.vocab-expanded {
  background:var(--panel); border-radius:16px;
  border:2px solid var(--ink); padding:20px;
  margin-bottom:10px;
  grid-column:1/-1;
  box-shadow:0 8px 30px rgba(28,32,51,0.12);
  animation:popIn .25s ease;
}
@keyframes popIn {
  from { opacity:0; transform:scale(.97); }
  to   { opacity:1; transform:scale(1); }
}
.ve-top { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; margin-bottom:18px; }
.ve-char-big {
  font-family:'Noto Sans TC',sans-serif;
  font-size:72px; font-weight:700; line-height:1; color:var(--ink);
  min-width:80px;
}
.ve-meta { flex:1; min-width:140px; }
.ve-py { font-size:18px; color:var(--red); font-weight:700; font-family:'Noto Sans TC',sans-serif; margin-bottom:4px; }
.ve-de { font-size:14px; color:var(--ink2); font-style:italic; margin-bottom:8px; }
.ve-strokes-label {
  font-size:10px; font-weight:800; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--ink3);
}
 
/* Stroke order grid */
.stroke-steps-row {
  display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end;
  margin-bottom:16px;
}
.stroke-step {
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.stroke-step-svg {
  border:1.5px solid var(--border); border-radius:8px;
  background:#fafafa; display:block;
}
.stroke-step-num {
  font-size:10px; font-weight:800; color:var(--ink3);
  font-family:'Nunito',sans-serif;
}
 
/* HanziWriter target area */
.hw-target { position:relative; display:inline-block; }
 
/* Controls */
.ve-controls { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
.btn-sm {
  padding:8px 16px; border-radius:50px;
  border:none; font-family:'Nunito',sans-serif;
  font-size:12px; font-weight:800; cursor:pointer; transition:all .2s;
  display:inline-flex; align-items:center; gap:5px;
}
.btn-play { background:var(--ink); color:#fff; }
.btn-play:hover { background:var(--blue); box-shadow:0 4px 12px rgba(58,111,216,0.35); }
.btn-quiz { background:var(--green); color:#fff; }
.btn-quiz:hover { filter:brightness(1.1); box-shadow:0 4px 12px rgba(46,139,87,0.35); }
.btn-close { background:none; border:1.5px solid var(--border) !important; color:var(--ink2); }
.btn-close:hover { border-color:var(--red) !important; color:var(--red); }
 
/* Practice grid */
.practice-section { margin-top:2px; }
.practice-label {
  font-size:10px; font-weight:800; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--ink3); margin-bottom:8px;
}
.practice-row {
  display:flex; flex-wrap:wrap; gap:6px;
  background:#f9f7f4; border-radius:10px;
  padding:12px; border:1px dashed var(--border);
}
.practice-cell {
  width:58px; height:58px; border:1.5px solid var(--border);
  border-radius:8px; background:#fff; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.practice-cell::before,
.practice-cell::after {
  content:''; position:absolute; background:rgba(58,111,216,0.1);
  pointer-events:none;
}
.practice-cell::before { width:100%; height:1px; top:50%; }
.practice-cell::after  { height:100%; width:1px; left:50%; }
.practice-guide-char {
  font-family:'Noto Sans TC',sans-serif;
  font-size:40px; line-height:1; color:rgba(28,32,51,0.15);
  pointer-events:none; user-select:none;
}
.practice-note {
  font-size:11px; color:var(--ink3); font-style:italic;
  margin-top:8px;
}
 
/* Stroke order animation target */
#hw-anim-container { position:relative; }
 
/* Responsive */
@media(max-width:560px){
  .vocab-grid { grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); }
  .ve-char-big { font-size:56px; }
  .lesson-hd-text h2 { font-size:20px; }
}
 
/* Fade-in */
.content-area { animation:fadeUp .3s ease; }
@keyframes fadeUp {
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
 
.hidden { display:none !important; }
</style>
</head>

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let state = {
  seriesId: null,
  bookId: null,
  lessonId: null,
  expandedVocabIdx: null,
  hwWriter: null,
};
 
// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
function init() {
  renderSeriesPills();
}
 
// ═══════════════════════════════════════════════════════
//  LEVEL 1: Series
// ═══════════════════════════════════════════════════════
function renderSeriesPills() {
  const row = document.getElementById('series-row');
  row.innerHTML = SERIES.map(s => `
    <button class="series-pill ${state.seriesId===s.id?'active':''}"
      onclick="selectSeries('${s.id}')">
      ${s.emoji} ${s.name}
    </button>
  `).join('');
}
 
function selectSeries(id) {
  state.seriesId = id;
  state.bookId = null;
  state.lessonId = null;
  state.expandedVocabIdx = null;
  renderSeriesPills();
  renderBookTabs();
  renderLessonStrip();
  showWelcome();
}
 
// ═══════════════════════════════════════════════════════
//  LEVEL 2: Books
// ═══════════════════════════════════════════════════════
function renderBookTabs() {
  const tabs = document.getElementById('book-tabs');
  if (!state.seriesId) { tabs.innerHTML=''; return; }
  const series = SERIES.find(s=>s.id===state.seriesId);
  tabs.innerHTML = series.books.map(b => `
    <button class="book-tab ${state.bookId===b.id?'active':''}"
      onclick="selectBook('${b.id}')">
      <span class="t-emoji">${b.emoji}</span>
      ${b.name}
      <span class="t-sub">${b.nameDE}</span>
    </button>
  `).join('');
}
 
function selectBook(id) {
  state.bookId = id;
  state.lessonId = null;
  state.expandedVocabIdx = null;
  renderBookTabs();
  renderLessonStrip();
  showWelcome();
}
 
// ═══════════════════════════════════════════════════════
//  LEVEL 3: Lessons
// ═══════════════════════════════════════════════════════
const LESSON_NUMS = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
 
function renderLessonStrip() {
  const strip = document.getElementById('lesson-strip');
  if (!state.seriesId || !state.bookId) {
    strip.innerHTML = '<div class="lesson-strip-label">請先選擇系列和冊數 · Bitte wähle eine Serie und ein Buch</div>';
    return;
  }
  const series = SERIES.find(s=>s.id===state.seriesId);
  const book = series.books.find(b=>b.id===state.bookId);
  strip.innerHTML = `
    <div class="lesson-strip-label">課程 · Lektionen</div>
    ${book.lessons.map(l=>`
      <button class="lesson-btn ${state.lessonId===l.id?'active':''}"
        onclick="selectLesson(${l.id})">
        <span class="l-num">第${LESSON_NUMS[l.id-1]}課</span>
        <span style="color:inherit;opacity:.7;font-size:11px;">${l.de.length>12?l.de.substring(0,12)+'…':l.de}</span>
      </button>
    `).join('')}
  `;
}
 
function selectLesson(id) {
  state.lessonId = id;
  state.expandedVocabIdx = null;
  destroyHanziWriter();
  renderLessonStrip();
  renderLesson();
}
 
// ═══════════════════════════════════════════════════════
//  LESSON RENDER
// ═══════════════════════════════════════════════════════
function showWelcome() {
  document.getElementById('content-area').innerHTML = `
    <div class="welcome">
      <div class="w-emoji">✏️</div>
      <h2>${state.bookId ? 'Wähle eine Lektion!' : 'Wähle ein Buch!'}</h2>
      <p>${state.bookId ? '選一課開始學習 😊<br>Klicke oben auf eine Lektion.' : '請選擇冊數 · Bitte wähle ein Buch aus.'}</p>
    </div>
  `;
}
 
function renderLesson() {
  const series = SERIES.find(s=>s.id===state.seriesId);
  const book = series.books.find(b=>b.id===state.bookId);
  const lesson = book.lessons.find(l=>l.id===state.lessonId);
  const ca = document.getElementById('content-area');
 
  const colors = ['vc-c1','vc-c2','vc-c3','vc-c4','vc-c5','vc-c6','vc-c7','vc-c8'];
 
  ca.innerHTML = `
    <div class="lesson-hd">
      <div class="lesson-badge">${lesson.id}</div>
      <div class="lesson-hd-text">
        <h2>${lesson.title}</h2>
        <div class="py">${lesson.py}</div>
        <div class="de">${lesson.de}</div>
      </div>
    </div>
 
    <div class="lesson-illo">
      ${lesson.emoji}
      <p>課文插圖 · Illustration zur Lektion</p>
    </div>
 
    <div class="sec-label">📖 課文 · Lektionstext</div>
    <div class="lesson-text-box">
      ${lesson.text.map(t=>`
        <div class="text-line">
          <div class="text-zh">${t.zh}</div>
          <div class="text-py">${t.py}</div>
        </div>
      `).join('')}
    </div>
 
    <div class="sec-label">✏️ 生字 · Neue Zeichen &amp; Strichreihenfolge</div>
    <div class="vocab-grid" id="vocab-grid">
      ${lesson.vocab.map((v,i)=>`
        <div class="vocab-card ${colors[i%colors.length]}"
          id="vc-${i}" onclick="toggleVocab(${i})"
          style="animation-delay:${i*.06}s">
          <div class="vc-char">${v.char}</div>
          <div class="vc-py">${v.py}</div>
          <div class="vc-de">${v.de}</div>
          <div class="vc-hint">👆 Tippen für Strichreihenfolge</div>
        </div>
      `).join('')}
    </div>
  `;
}
 
// ═══════════════════════════════════════════════════════
//  VOCAB EXPAND + HANZI WRITER
// ═══════════════════════════════════════════════════════
function destroyHanziWriter() {
  if (state.hwWriter) {
    try { state.hwWriter = null; } catch(e){}
  }
  const old = document.getElementById('hw-container');
  if (old) old.innerHTML = '';
}
 
function toggleVocab(idx) {
  destroyHanziWriter();
 
  if (state.expandedVocabIdx === idx) {
    state.expandedVocabIdx = null;
    renderLesson();
    return;
  }
 
  state.expandedVocabIdx = idx;
 
  const series = SERIES.find(s=>s.id===state.seriesId);
  const book = series.books.find(b=>b.id===state.bookId);
  const lesson = book.lessons.find(l=>l.id===state.lessonId);
  const vocab = lesson.vocab[idx];
  const colors = ['vc-c1','vc-c2','vc-c3','vc-c4','vc-c5','vc-c6','vc-c7','vc-c8'];
 
  // Rebuild grid with expanded card
  const grid = document.getElementById('vocab-grid');
 
  // Build cards HTML, replacing the target card
  let cardsHTML = lesson.vocab.map((v,i) => {
    if (i === idx) return buildExpandedCard(vocab, idx, colors[i%colors.length]);
    return `
      <div class="vocab-card ${colors[i%colors.length]}"
        id="vc-${i}" onclick="toggleVocab(${i})"
        style="animation-delay:${i*.06}s">
        <div class="vc-char">${v.char}</div>
        <div class="vc-py">${v.py}</div>
        <div class="vc-de">${v.de}</div>
        <div class="vc-hint">👆 Tippen für Strichreihenfolge</div>
      </div>
    `;
  }).join('');
 
  grid.innerHTML = cardsHTML;
 
  // Initialize HanziWriter after DOM update
  setTimeout(() => initHanziWriter(vocab.char, idx), 50);
}
 
function buildExpandedCard(vocab, idx, colorClass) {
  // Build practice cells: 1 ghost + 7 blank
  let practiceCells = `
    <div class="practice-cell">
      <span class="practice-guide-char">${vocab.char}</span>
    </div>
  `;
  for(let i=0;i<7;i++) practiceCells += `<div class="practice-cell"></div>`;
 
  return `
    <div class="vocab-expanded ${colorClass}" id="vc-${idx}">
      <div class="ve-top">
        <div class="ve-char-big">${vocab.char}</div>
        <div class="ve-meta">
          <div class="ve-py">${vocab.py}</div>
          <div class="ve-de">${vocab.de}</div>
          <div class="ve-strokes-label">約 ${vocab.strokes} 筆 · ca. ${vocab.strokes} Striche</div>
        </div>
      </div>
 
      <div class="sec-label" style="margin-bottom:10px;">🖊️ 筆順動畫 · Strichreihenfolge-Animation</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:16px;">
        <div id="hw-container" style="position:relative;">
          <!-- HanziWriter renders here -->
          <div style="width:160px;height:160px;background:#f5f3f0;border-radius:12px;
            border:1.5px solid #e2ddd8;display:flex;align-items:center;justify-content:center;">
            <span style="color:#bbb;font-size:12px;">載入中…</span>
          </div>
        </div>
        <div>
          <div class="ve-controls">
            <button class="btn-sm btn-play" onclick="playAnimation()">▶ Strichreihenfolge abspielen</button>
            <button class="btn-sm btn-quiz" onclick="startQuiz()">✍️ Schreiben üben</button>
          </div>
          <div style="font-size:11px;color:#888;line-height:1.6;max-width:220px;">
            🔴 Klicke <strong>Abspielen</strong> um die Strichreihenfolge zu sehen.<br>
            ✍️ Klicke <strong>Üben</strong> um selbst zu schreiben.<br>
            <span style="color:#3a6fd8;">Jeder Strich wird separat in der richtigen Reihenfolge animiert.</span>
          </div>
        </div>
      </div>
 
      <div class="practice-section">
        <div class="practice-label">✏️ Schreiben üben · 寫字練習格</div>
        <div class="practice-row">${practiceCells}</div>
        <div class="practice-note">💡 Das erste Feld zeigt das Zeichen als Vorlage (beschreibe die anderen Felder auf Papier)</div>
      </div>
 
      <div style="margin-top:16px;">
        <button class="btn-sm btn-close" style="border:1.5px solid #e2ddd8;"
          onclick="toggleVocab(${idx})">✕ Schließen</button>
      </div>
    </div>
  `;
}
 
function initHanziWriter(char, idx) {
  const container = document.getElementById('hw-container');
  if (!container) return;
 
  container.innerHTML = '';
 
  try {
    const writer = HanziWriter.create(container, char, {
      width: 160,
      height: 160,
      padding: 12,
      strokeColor: '#1c2033',
      radicalColor: '#d9432a',
      highlightColor: '#3a6fd8',
      outlineColor: '#e2ddd8',
      drawingColor: '#1c2033',
      drawingWidth: 4,
      strokeAnimationSpeed: 1,
      delayBetweenStrokes: 300,
      showCharacter: true,
      showOutline: true,
      // Grid lines (田字格)
      showHintAfterMisses: 3,
      rendererType: 'svg',
      onLoadCharDataSuccess: function() {
        // character loaded
      },
      onLoadCharDataError: function(reason) {
        container.innerHTML = `
          <div style="width:160px;height:160px;background:#fff5f5;border-radius:12px;
            border:1.5px solid #f5c0b8;display:flex;flex-direction:column;
            align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;">
            <span style="font-size:56px;font-family:'Noto Sans TC',sans-serif;">${char}</span>
            <span style="font-size:10px;color:#d9432a;">筆順資料暫無 · Strichdaten nicht verfügbar</span>
          </div>
        `;
      }
    });
 
    // Add grid lines via SVG overlay
    addGridLines(container, 160);
    state.hwWriter = writer;
 
  } catch(e) {
    container.innerHTML = `
      <div style="width:160px;height:160px;background:#f5f3f0;border-radius:12px;
        display:flex;align-items:center;justify-content:center;">
        <span style="font-size:64px;font-family:'Noto Sans TC',sans-serif;">${char}</span>
      </div>
    `;
  }
}
 
function addGridLines(container, size) {
  // Find the SVG inside HanziWriter container and add grid lines
  setTimeout(() => {
    const svg = container.querySelector('svg');
    if (!svg) return;
    const ns = 'http://www.w3.org/2000/svg';
 
    // Horizontal center
    const h = document.createElementNS(ns, 'line');
    h.setAttribute('x1','0'); h.setAttribute('y1', size/2);
    h.setAttribute('x2', size); h.setAttribute('y2', size/2);
    h.setAttribute('stroke','rgba(58,111,216,0.2)');
    h.setAttribute('stroke-width','1');
    h.setAttribute('stroke-dasharray','4,4');
    svg.insertBefore(h, svg.firstChild);
 
    // Vertical center
    const v = document.createElementNS(ns, 'line');
    v.setAttribute('x1', size/2); v.setAttribute('y1','0');
    v.setAttribute('x2', size/2); v.setAttribute('y2', size);
    v.setAttribute('stroke','rgba(58,111,216,0.2)');
    v.setAttribute('stroke-width','1');
    v.setAttribute('stroke-dasharray','4,4');
    svg.insertBefore(v, svg.firstChild);
 
    // Border
    const rect = document.createElementNS(ns, 'rect');
    rect.setAttribute('x','0'); rect.setAttribute('y','0');
    rect.setAttribute('width', size); rect.setAttribute('height', size);
    rect.setAttribute('fill','none');
    rect.setAttribute('stroke','#e2ddd8');
    rect.setAttribute('stroke-width','1.5');
    rect.setAttribute('rx','12');
    svg.insertBefore(rect, svg.firstChild);
  }, 100);
}
 
function playAnimation() {
  if (!state.hwWriter) return;
  state.hwWriter.animateCharacter({
    onComplete: function() { /* done */ }
  });
}
 
function startQuiz() {
  if (!state.hwWriter) return;
  state.hwWriter.quiz({
    onMistake: function(strokeData) {
      // Flash red on mistake
    },
    onCorrectStroke: function(strokeData) {
      // Progress feedback
    },
    onComplete: function(summaryData) {
      alert(`🎉 Prima! Du hast alle ${summaryData.totalMistakes===0?'Striche ohne Fehler':'Striche'} geschrieben!\n✨ Fehler: ${summaryData.totalMistakes}`);
    }
  });
}
 
// ═══════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════
init();
</script>
